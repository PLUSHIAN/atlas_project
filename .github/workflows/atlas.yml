name: ATLAS - Passagens Europa

on:
  # Primeiro disparo automático ao publicar esta alteração na branch main.
  # Editar apenas outros arquivos não provoca novas consultas imediatas.
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas.yml'
  schedule:
    # UTC ímpar = Brasília par (18h, 20h, 22h, ...). Quatro tentativas por ciclo.
    # Primeiro horário após a ativação de 22/11/2026: 18h37 de Brasília.
    # As três contingências são 5, 10 e 15 minutos após a principal.
    # Os checks no SQLite impedem 2 buscas válidas no mesmo ciclo.
    - cron: '37 1-23/2 * * *'
    - cron: '42 1-23/2 * * *'
    - cron: '47 1-23/2 * * *'
    - cron: '52 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      destination:
        description: 'Destino desta execução (auto respeita o intervalo de economia)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - Barcelona
          - Madri
          - Roma
          - Milão
          - 'Roma → Milão'
          - 'Milão → Roma'

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-monitor-and-pages
  cancel-in-progress: false

jobs:
  scan-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      MONITOR_ENABLED: 'false'
      OPEN_JAW_ENABLED: 'true'
      SPAIN_PRIORITY: 'true'
      SCAN_INTERVAL_HOURS: '2'
      CLOUD_MIN_SCAN_HOURS: '2'
      MAX_REQUESTS_30D: '250'
      MAX_RETURN_CHECKS_PER_SCAN: '2'
      CACHE_HOURS: '1'
      DB_PATH: 'data/passagens.sqlite3'
      ATLAS_STATE_KEY: ${{ secrets.ATLAS_STATE_KEY }}
      # Gmail: valores não confidenciais definidos no workflow.
      # E-mail só é habilitado quando usuário e senha foram configurados em Secrets.
      MAIL_ENABLED: ${{ secrets.SMTP_USER != '' && secrets.SMTP_PASSWORD != '' }}
      SMTP_HOST: 'smtp.gmail.com'
      SMTP_PORT: '587'
      SMTP_SSL: 'false'
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
      ALERT_TO: ${{ secrets.ALERT_TO || secrets.SMTP_USER }}
      ALERT_MIN_DROP_PCT: '5'
      ALERT_MIN_DROP_BRL: '200'
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Registrar origem da execução
        run: |
          echo "Evento: ${GITHUB_EVENT_NAME}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Agenda UTC: horas ímpares / minutos 37, 42, 47, 52"
          echo "Disparo: ${{ github.event.schedule || 'push/manual' }}"

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências backend
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Validar criptografia do histórico
        shell: bash
        run: |
          if [ -z "$ATLAS_STATE_KEY" ]; then
            echo "::error::Configure o secret ATLAS_STATE_KEY antes de executar. Isso protege o histórico do SQLite quando o repositório for público."
            exit 1
          fi
          python -m pip install 'cryptography>=44,<47'

      - name: Localizar último estado criptografado
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=atlas-state-encrypted&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          echo "run_id=$LAST" >> "$GITHUB_OUTPUT"
          if [ -n "$LAST" ]; then echo "Estado anterior: run $LAST"; else echo "Primeira execução: novo banco"; fi

      - name: Recuperar SQLite e histórico de alertas
        if: steps.state.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: atlas-state-encrypted
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ github.token }}
          path: state

      - name: Descriptografar histórico anterior
        if: steps.state.outputs.run_id != ''
        run: python -m backend.app.state_artifact decrypt state/atlas-state.enc data/passagens.sqlite3

      - name: Verificar integridade do banco restaurado
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          p=Path('data/passagens.sqlite3')
          if p.exists():
              with sqlite3.connect(p) as db:
                  assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              print('SQLite recuperado e íntegro')
          else:
              print('Primeira execução; o SQLite será criado')
          PY

      - name: Rodar testes Python (sem consultar API)
        run: python -m pytest backend/tests -q

      - name: Incorporar custos de deslocamento informados manualmente
        run: python -m backend.app.load_extras

      - name: Pesquisar passagens a cada 2h (respeitar cota da fonte)
        id: scan
        continue-on-error: true
        shell: bash
        env:
          DESTINATION: ${{ github.event.inputs.destination || 'auto' }}
        run: python -m backend.app.cloud_runner --destination "$DESTINATION"

      - name: Exportar snapshot público (somente dados necessários)
        run: python -m backend.app.export_static

      - name: Criptografar estado persistente
        if: always() && env.ATLAS_STATE_KEY != ''
        run: |
          if [ -f data/passagens.sqlite3 ]; then
            python -m backend.app.state_artifact encrypt data/passagens.sqlite3 state/atlas-state.enc
          fi

      - name: Salvar somente SQLite criptografado
        if: always() && env.ATLAS_STATE_KEY != ''
        uses: actions/upload-artifact@v6
        with:
          name: atlas-state-encrypted
          path: state/atlas-state.enc
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Construir frontend estático
        env:
          GITHUB_PAGES: 'true'
          VITE_STATIC_MODE: 'true'
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

      - name: Disponibilizar painel como artefato privado
        uses: actions/upload-artifact@v6
        with:
          name: atlas-dashboard
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Preparar arquivos públicos para o GitHub Pages
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/

      - name: Indicar falha de consulta sem perder histórico ou dashboard
        if: steps.scan.outcome == 'failure'
        run: |
          echo 'Pesquisa falhou. Confira o log. SQLite e painel foram preservados como artifacts.'
          exit 1

  deploy-pages:
    if: github.event.repository.private == false
    needs: scan-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar dashboard no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
